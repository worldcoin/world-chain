# Verifies proofs/measurements.json against what the source actually measures to.
# Two halves, verified independently and only when a file that can move them changed:
#   .sp1   — guest vkeys, derived by rebuilding the ELFs through the pinned Docker toolchain
#   .nitro — enclave PCRs, derived by rebuilding the EIF with Nix via scripts/build-eif.sh
# Both jobs surface the fresh values on mismatch but never commit them: rotating a
# measurement stays a human act (see release-proof.yml for the release-time PR flow).
name: verify-measurements

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'proofs/measured/**'
      - 'proofs/backends/sp1/elfs/**'
      - 'proofs/protocol/**'
      - 'proofs/measurements.json'
      - 'Cargo.lock'
      - 'Justfile'
      - 'justfiles/proof.just'
      - 'flake.nix'
      - 'flake.lock'
      - 'rust-toolchain.toml'
      - 'scripts/build-eif.sh'
      - '.github/workflows/verify-measurements.yml'

jobs:
  changes:
    name: detect measurement-affecting changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      sp1: ${{ steps.filter.outputs.sp1 }}
      nitro: ${{ steps.filter.outputs.nitro }}
    steps:
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            sp1:
              - 'proofs/measured/sp1-programs/**'
              - 'proofs/measured/core/**'
              - 'proofs/measured/kona-client/**'
              - 'proofs/backends/sp1/elfs/**'
              - 'proofs/protocol/**'
              - 'proofs/measurements.json'
              - 'Cargo.lock'
              - 'Justfile'
              - 'justfiles/proof.just'
              - '.github/workflows/verify-measurements.yml'
            nitro:
              - 'proofs/measured/nitro-enclave/**'
              - 'proofs/measured/core/**'
              - 'proofs/measured/kona-client/**'
              - 'proofs/measurements.json'
              - 'flake.nix'
              - 'flake.lock'
              - 'rust-toolchain.toml'
              - 'scripts/build-eif.sh'
              - '.github/workflows/verify-measurements.yml'

  verify-vkeys:
    name: verify vkeys match source
    needs: changes
    if: needs.changes.outputs.sp1 == 'true'
    runs-on: arc-public-8xlarge-amd64-runner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install SP1 toolchain
        run: |
          curl -fsSL https://sp1.succinct.xyz -o "$RUNNER_TEMP/sp1up-install.sh"
          bash "$RUNNER_TEMP/sp1up-install.sh"
          ~/.sp1/bin/sp1up --version v6.3.1
          echo "$HOME/.sp1/bin" >> "$GITHUB_PATH"

      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: just

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable

      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Verify vkeys
        env:
          SP1_BUILD_DOCKER: "true"
        run: just verify-proof-vkeys

      # Surface, never commit: rotating a measurement stays a human act. On a mismatch,
      # publish the freshly derived `.sp1` half so the author can paste it into
      # proofs/measurements.json without a local SP1 toolchain.
      - name: Report fresh vkeys
        if: failure()
        run: |
          set -euo pipefail
          if [ ! -f /tmp/vkeys-actual-normalized.json ]; then
            echo "verify-proof-vkeys failed before vkeys were derived — see the step above." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Committed \`.sp1\` measurements are stale"
            echo '```diff'
            diff -u /tmp/vkeys-committed.json /tmp/vkeys-actual-normalized.json || true
            echo '```'
            echo "Fresh \`.sp1\` half — paste into \`proofs/measurements.json\`, or run \`just update-proof-vkeys\` locally:"
            echo '```json'
            cat /tmp/vkeys-actual-normalized.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload fresh vkeys
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fresh-sp1-vkeys
          path: /tmp/vkeys-actual-normalized.json
          if-no-files-found: ignore

  verify-pcrs:
    name: verify PCRs match source
    needs: changes
    if: needs.changes.outputs.nitro == 'true'
    runs-on: arc-public-8xlarge-amd64-runner
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Pinned single-user install. The ARC runner image ships /nix world-writable (a volume
      # mount), which nix refuses, and offers neither systemd nor a local docker daemon for
      # the Determinate installer's daemon modes — its docker shim exits 125 because the
      # DinD sidecar cannot mount this pod's /nix. A single-user install needs neither.
      - name: Install Nix
        env:
          NIX_VERSION: 2.30.1
          # sha256 of the install script below. The script embeds per-platform tarball
          # hashes, so pinning it pins the entire install.
          NIX_INSTALLER_SHA256: b88ba4f48180d7cd30f453a5010abb5c3edf5e16202edd586120f24d7735479b
        run: |
          set -euo pipefail
          if [ -L /nix ]; then sudo rm /nix; fi
          sudo mkdir -p /nix
          sudo chown "$(id -u):$(id -g)" /nix
          sudo chmod 0755 /nix
          # Sandbox-less builds run wherever nix puts them, and cargo hashes the build path
          # into every binary. flake.nix relocates the enclave build to /build (the sandbox's
          # constant path) when it exists — create it so that kicks in.
          sudo mkdir -p /build
          sudo chown "$(id -u):$(id -g)" /build
          curl --proto '=https' --tlsv1.2 -sSf -L "https://releases.nixos.org/nix/nix-${NIX_VERSION}/install" -o "$RUNNER_TEMP/nix-install.sh"
          echo "$NIX_INSTALLER_SHA256  $RUNNER_TEMP/nix-install.sh" | sha256sum -c
          sh "$RUNNER_TEMP/nix-install.sh" --no-daemon
          # Build sandboxing needs unprivileged user namespaces, which the pod does not
          # grant. Determinism is carried by the pinned closure and the double-build
          # reproducibility check, not the sandbox.
          mkdir -p ~/.config/nix
          printf 'experimental-features = nix-command flakes\nsandbox = false\n' > ~/.config/nix/nix.conf
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - name: Build EIF and measure
        run: scripts/build-eif.sh target/eif

      - name: Verify PCRs
        run: |
          set -euo pipefail
          if diff <(jq -S .nitro proofs/measurements.json) <(jq -S .nitro target/eif/measurements.json) > /tmp/nitro-measurements.diff; then
            echo "PCRs match the committed proofs/measurements.json." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Committed \`.nitro\` measurements are stale"
              echo '```diff'
              cat /tmp/nitro-measurements.diff
              echo '```'
              echo "Fresh \`.nitro\` half — paste into \`proofs/measurements.json\`:"
              echo '```json'
              jq -S .nitro target/eif/measurements.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ERROR: the .nitro half of proofs/measurements.json is out of date." >&2
            exit 1
          fi

      - name: Upload fresh measurements
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fresh-nitro-measurements
          path: target/eif/measurements.json
          if-no-files-found: ignore
