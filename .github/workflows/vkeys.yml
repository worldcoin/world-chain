# Verifies that the SP1 measurements built from current source match the
# registry's current release entry (proof-releases.lock). Runs on PRs
# that touch proof program sources or the registry itself: measurement changes
# cannot merge without a new release entry (`just proof-release --version X.Y.Z`).
name: verify-vkeys

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'proofs/backends/sp1/programs/**'
      - 'proofs/backends/sp1/elfs/**'
      - 'proof-releases.lock'
      - 'proofs/measured/**'
      - 'proofs/protocol/**'
      - 'Cargo.lock'
      - 'Justfile'
      - '.github/workflows/vkeys.yml'

jobs:
  verify-vkeys:
    name: verify vkeys match registry
    runs-on: arc-public-8xlarge-amd64-runner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install SP1 toolchain
        run: |
          curl -fsSL https://sp1.succinct.xyz -o "$RUNNER_TEMP/sp1up-install.sh"
          bash "$RUNNER_TEMP/sp1up-install.sh"
          ~/.sp1/bin/sp1up --version v6.1.0
          echo "$HOME/.sp1/bin" >> "$GITHUB_PATH"

      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: just

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable

      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Verify vkeys
        env:
          SP1_BUILD_DOCKER: "true"
        run: just verify-proof-vkeys
