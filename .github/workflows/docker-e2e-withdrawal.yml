name: docker-e2e-withdrawal

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "e2e-tests/e2e-withdrawal/**"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "Dockerfile.e2e-withdrawal"
      - ".dockerignore"
      - ".github/workflows/docker-e2e-withdrawal.yml"
      - ".github/actions/docker-build-push-digest/**"
      - ".github/actions/docker-merge-manifest/**"

env:
  IMAGE_NAME: ${{ github.repository }}-e2e-withdrawal
  REGISTRY: ghcr.io
  AWS_REGION: us-east-1
  SCCACHE_BUCKET: crypto-dev-us-east-1-workflow-build-cache

permissions:
  contents: read

concurrency:
  group: docker-e2e-withdrawal-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-and-push:
    if: github.repository == 'worldcoin/world-chain'
    timeout-minutes: 120
    environment:
      name: dev
      deployment: false
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: arc-public-8xlarge-amd64-runner
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build and push digest
        uses: ./.github/actions/docker-build-push-digest
        with:
          platform: ${{ matrix.platform }}
          registry: ${{ env.REGISTRY }}
          image_name: ${{ env.IMAGE_NAME }}
          aws_region: ${{ env.AWS_REGION }}
          sccache_bucket: ${{ env.SCCACHE_BUCKET }}
          dockerfile: Dockerfile.e2e-withdrawal
          git_sha: ${{ github.sha }}

  merge:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out workflow actions
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Merge multi-architecture manifest
        id: merge
        uses: ./.github/actions/docker-merge-manifest
        with:
          registry: ${{ env.REGISTRY }}
          image_name: ${{ env.IMAGE_NAME }}
          tags: type=raw,value=sha-${{ github.sha }}
      - name: Summarize published image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          SHA: ${{ github.sha }}
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: |
          printf 'Image: `%s:sha-%s`\n\nManifest: `%s@%s`\n' \
            "$IMAGE" "$SHA" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
