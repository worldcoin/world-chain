# Temporary diagnostic: build the enclave image twice from identical source and diff the
# resulting rootfs entry-by-entry, to confirm PCR0/PCR2 are reproducible.
# Delete once the fix has landed.
name: eif-probe

on:
  push:
    branches: ["scratch/eif-determinism"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: arc-public-8xlarge-amd64-runner
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      - name: Build twice and diff the rootfs
        run: |
          set -euo pipefail
          # `docker create`/`docker export` inject these per-container; linuxkit reads image
          # layers and never sees them, so they are probe noise rather than PCR inputs.
          injected='^(\.dockerenv|dev$|dev/|etc$|etc/hostname$|etc/hosts$|etc/resolv\.conf$|etc/mtab$)'

          for tag in a b; do
            echo "::group::build $tag"
            scripts/build-enclave-image.sh "probe:$tag" --no-cache
            echo "::endgroup::"
            cid=$(docker create "probe:$tag")
            docker export "$cid" | python3 scripts/rootfs-manifest.py \
              | awk -v skip="$injected" '$NF !~ skip' > "/tmp/$tag.manifest"
            docker rm "$cid" >/dev/null
            echo "$tag entries: $(wc -l < "/tmp/$tag.manifest")"
          done

          if diff /tmp/a.manifest /tmp/b.manifest > /tmp/manifest.diff; then
            echo "ROOTFS REPRODUCIBLE — image rootfs is bit-for-bit identical across builds"
          else
            echo "ROOTFS STILL DIFFERS:"
            head -60 /tmp/manifest.diff
            echo "--- total differing lines: $(grep -c '^[<>]' /tmp/manifest.diff) ---"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rootfs-manifests
          path: /tmp/*.manifest
