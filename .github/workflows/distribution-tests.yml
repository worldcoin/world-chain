name: Distribution input tests

on:
  pull_request:
    paths:
      - .github/scripts/distribution-inputs.py
      - .github/scripts/distribution-package.py
      - .github/scripts/test_distribution_inputs.py
      - .github/scripts/test_distribution_package.py
      - .github/scripts/test_distribution_examples.py
      - docs/distribution.md
      - docs/distribution-build.md
      - docs/release-page-preview.md
      - examples/distribution/**
      - .github/workflows/distribution-tests.yml
  push:
    branches: [main]
    paths:
      - .github/scripts/distribution-inputs.py
      - .github/scripts/distribution-package.py
      - .github/scripts/test_distribution_inputs.py
      - .github/scripts/test_distribution_package.py
      - .github/scripts/test_distribution_examples.py
      - docs/distribution.md
      - docs/distribution-build.md
      - docs/release-page-preview.md
      - examples/distribution/**
      - .github/workflows/distribution-tests.yml

permissions:
  contents: read

jobs:
  test:
    name: distribution-input-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test distribution inputs and asset plan
        run: python3 -m unittest discover -s .github/scripts -p 'test_distribution*.py' -v
