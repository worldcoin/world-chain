name: CI

permissions: {}

on:
  push:
    branches: [main]
    paths:
      - "pkg/contracts/**"
      - ".gitmodules"
      - ".github/workflows/foundry.yml"
  pull_request:
    paths:
      - "pkg/contracts/**"
      - ".gitmodules"
      - ".github/workflows/foundry.yml"
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pkg/contracts
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: true

      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: just@1.57.0
          fallback: none

      - name: Set up Solidity dependencies
        run: just setup-contracts

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: v1.8.0

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Build pinned OP Stack artifacts
        run: forge build
        working-directory: pkg/contracts/opstack

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test
        env:
          WORLDCHAIN_PROVIDER: "https://worldchain-mainnet.gateway.tenderly.co"
          ETHEREUM_PROVIDER: "https://ethereum-rpc.publicnode.com"
