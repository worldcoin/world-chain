name: Benchmark Regression Check

on:
  pull_request:
    # Only run when core execution crates change. These crates host the
    # benchmarked code paths (flashblock validation / payload building).
    paths:
      - 'crates/payload/**'
      - 'crates/validator/**'
      - 'crates/builder/**'
      - 'crates/evm/**'
      - '.github/workflows/benchmarks.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  BENCH_NAME: flashblock_validation_synthetic

jobs:
  benchmark:
    runs-on: arc-public-8xlarge-amd64-runner
    timeout-minutes: 120
    env:
      LLVM_SYS_221_PREFIX: /usr/lib/llvm-22
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable

      # Required by the revmc JIT backend that the `jit` baseline builds.
      - name: Install LLVM 22
        run: sudo bash .github/scripts/install_llvm_ubuntu.sh 22

      - name: Cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        continue-on-error: false
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-bench-

      - name: Install critcmp
        run: cargo install critcmp --locked

      # Benchmark the base revision and the PR revision in the same job so
      # both measurements run on the same machine under similar conditions.
      - name: Run base benchmarks
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git checkout --detach "$BASE_SHA"
          if [ -f "crates/validator/benches/${BENCH_NAME}.rs" ]; then
            BENCH_PACKAGE=world-chain-validator
          elif [ -f "crates/builder/benches/${BENCH_NAME}.rs" ]; then
            BENCH_PACKAGE=world-chain-builder
          else
            echo "::error::Could not find ${BENCH_NAME} benchmark"
            exit 1
          fi
          echo "Running ${BENCH_NAME} from ${BENCH_PACKAGE}"
          cargo bench --package "$BENCH_PACKAGE" --bench "$BENCH_NAME" -- --save-baseline base

      - name: Run PR benchmarks
        if: github.event_name == 'pull_request'
        env:
          PR_SHA: ${{ github.sha }}
        run: |
          git checkout --detach "$PR_SHA"
          if [ -f "crates/validator/benches/${BENCH_NAME}.rs" ]; then
            BENCH_PACKAGE=world-chain-validator
          elif [ -f "crates/builder/benches/${BENCH_NAME}.rs" ]; then
            BENCH_PACKAGE=world-chain-builder
          else
            echo "::error::Could not find ${BENCH_NAME} benchmark"
            exit 1
          fi
          echo "Running ${BENCH_NAME} from ${BENCH_PACKAGE}"
          cargo bench --package "$BENCH_PACKAGE" --bench "$BENCH_NAME" -- --save-baseline pr

      - name: Run benchmarks
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ -f "crates/validator/benches/${BENCH_NAME}.rs" ]; then
            BENCH_PACKAGE=world-chain-validator
          elif [ -f "crates/builder/benches/${BENCH_NAME}.rs" ]; then
            BENCH_PACKAGE=world-chain-builder
          else
            echo "::error::Could not find ${BENCH_NAME} benchmark"
            exit 1
          fi
          echo "Running ${BENCH_NAME} from ${BENCH_PACKAGE}"
          cargo bench --package "$BENCH_PACKAGE" --bench "$BENCH_NAME" -- --save-baseline pr

      # Third baseline on the same runner and the same revision as `pr`: only the `jit` feature
      # differs, which swaps `EVM_CONFIG` for one backed by the revmc JIT backend. `pr` doubles as
      # the interpreter side of the comparison, so no separate `nojit` run is needed.
      #
      # Hardcoded to world-chain-validator because that is the crate carrying the `jit` feature, and
      # `flashblock_validation_synthetic` is the only bench that dispatches the out-of-process JIT
      # helper.
      - name: Run JIT benchmarks
        run: |
          cargo bench --package world-chain-validator --features jit --bench "$BENCH_NAME" \
            -- --save-baseline jit

      # Compare against main baseline if available
      - name: Check for regressions
        if: github.event_name == 'pull_request'
        run: |
          echo "=== Full Benchmark Comparison ==="
          critcmp base pr jit

          # The gate deliberately compares base against pr only. The `jit` baseline is
          # informational: a JIT slowdown on a bytecode-light fixture is expected and must not
          # fail the build.
          echo ""
          echo "=== Checking for >10% regressions ==="
          filtered=$(critcmp base pr --threshold 10 2>&1 || true)

          # critcmp always exits 0 - we must parse output to detect regressions.
          # In the output, the FASTER baseline gets ratio 1.00.
          # If 'base' shows 1.00 in a data row, 'pr' is slower (regression).
          # Data rows start after the header (line 1) and separator (line 2).
          regressions=$(echo "$filtered" | awk 'NR > 2 && NF > 0' | grep -E '^\S+\s+1\.00\s' || true)

          if [ -n "$regressions" ]; then
            echo ""
            echo "Regressions detected (>10% slower than base):"
            echo "$filtered"
            echo ""
            echo "::error::Performance regression detected - pr is >10% slower than the base branch in the same workflow run"
            exit 1
          fi

          echo "No significant regressions detected."

      # Post results as PR comment
      - name: Post benchmark comparison
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          THRESHOLD: '10'
        with:
          script: |
            const { execSync } = require('child_process');
            const threshold = Number(process.env.THRESHOLD);

            // Parse critcmp's column output into structured rows. Each data row holds a benchmark
            // name followed by, per baseline, a ratio (the fastest baseline is 1.00) and an
            // estimate token containing "±". We anchor on the "±" tokens so any optional
            // throughput columns are skipped reliably.
            //
            // Baselines are keyed by the names in critcmp's `group <name>...` header rather than by
            // column position, so the mapping cannot silently swap if critcmp reorders columns.
            function parse(output) {
              const rows = [];
              let order = [];
              for (const line of output.split('\n')) {
                const tokens = line.trim().split(/\s+/).filter(Boolean);
                if (tokens[0] === 'group') {
                  order = tokens.slice(1);
                  continue;
                }
                const timeIdx = tokens.flatMap((t, i) => (t.includes('±') ? [i] : []));
                // Require one cell per known baseline; a partial row would misalign the mapping.
                if (!order.length || timeIdx.length !== order.length) continue;
                const name = tokens.slice(0, timeIdx[0] - 1).join(' ');
                if (!name) continue;
                const cells = {};
                timeIdx.forEach((idx, i) => {
                  cells[order[i]] = {
                    ratio: Number(tokens[idx - 1]),
                    time: tokens[idx],
                  };
                });
                rows.push({ name, cells });
              }
              return rows;
            }

            // Ratios are relative to the fastest baseline, so a ratio quotient is the real delta.
            function delta(from, to) {
              if (!from || !to) return NaN;
              if (!Number.isFinite(from.ratio) || from.ratio <= 0) return NaN;
              if (!Number.isFinite(to.ratio)) return NaN;
              return (to.ratio / from.ratio - 1) * 100;
            }

            // `gated` columns can go red, since a regression there fails the build. The JIT column
            // never fails the build, so it tops out at 🟡 to avoid reading as a failure.
            function pctCell(pct, gated) {
              if (!Number.isFinite(pct)) return 'n/a';
              const sign = pct >= 0 ? '+' : '';
              let icon = '🟢'; // faster
              if (gated && pct > threshold) icon = '🔴';
              else if (pct > 0) icon = '🟡';
              return `${icon} ${sign}${pct.toFixed(2)}%`;
            }

            function render(rows) {
              const header = [
                '| Benchmark | Base | PR | Change | PR + JIT | JIT vs PR |',
                '| :--- | ---: | ---: | :--- | ---: | :--- |',
              ].join('\n');
              const lines = rows.map((r) => {
                const base = r.cells.base;
                const pr = r.cells.pr;
                const jit = r.cells.jit;
                const cols = [
                  `\`${r.name}\``,
                  base ? base.time : 'n/a',
                  pr ? pr.time : 'n/a',
                  pctCell(delta(base, pr), true),
                  jit ? jit.time : 'n/a',
                  pctCell(delta(pr, jit), false),
                ];
                return `| ${cols.join(' | ')} |`;
              });
              return [header, ...lines].join('\n');
            }

            try {
              const output = execSync('critcmp base pr jit --color never', {
                encoding: 'utf-8',
              });
              const rows = parse(output);
              const table = rows.length
                ? render(rows)
                : '_Could not parse benchmark output; see raw results below._';

              const body = [
                '## Benchmark Results',
                '',
                'All three baselines measured on the same runner in the same workflow run.',
                '`Base` and `PR` are the interpreter at each revision; `PR + JIT` is the PR revision',
                'built with the revmc JIT backend (`--features jit`).',
                '',
                table,
                '',
                `> **Change** (Base → PR): 🔴 regression > ${threshold}% &nbsp;·&nbsp; 🟡 slower &nbsp;·&nbsp; 🟢 faster. A regression > ${threshold}% fails the check.`,
                '>',
                '> **JIT vs PR** (interpreter → JIT, same revision): 🟡 slower &nbsp;·&nbsp; 🟢 faster. Informational only — never fails the check, since fixtures without heavy bytecode are not expected to gain from JIT.',
                '',
                '<details><summary>Raw <code>critcmp</code> output</summary>',
                '',
                '```',
                output.trimEnd(),
                '```',
                '',
                '</details>',
              ].join('\n');

              // Check for existing comment to update
              const { data: comments } = await github.rest.issues.listComments({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              const existing = comments.find((c) =>
                c.body.startsWith('## Benchmark Results')
              );
              if (existing) {
                await github.rest.issues.updateComment({
                  comment_id: existing.id,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body,
                });
              }
            } catch (e) {
              console.log('Could not post benchmark comment:', e.message);
            }
