name: docker-proof

# Image-only path for the prover deployables: builds and pushes the prover docker
# images to ghcr on merge to main (tag `nightly`) or via manual dispatch with a
# chosen `image_tag` (e.g. `alpha-v0.1.0`). It does NOT cut a release — versioned
# releases (manifest.json, signed binaries, EIF, vkeys) are cut by release-proof.yml
# on `proofs/v*` tag pushes, which calls this workflow with `services_only` to publish
# the service images at the release version.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to build.
        required: false
        default: main
      image_tag:
        description: Custom image tag to publish (e.g. "alpha-v0.1.0").
        required: false
        default: nightly
  workflow_call:
    inputs:
      ref:
        description: Branch, tag, or SHA to build.
        required: true
        type: string
      image_tag:
        description: Image tag to publish.
        required: true
        type: string
      services_only:
        description: Skip the enclave/EIF jobs; the caller publishes those from its own verified build.
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "proofs/**"
      - "crates/chainspec/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/config.toml"
      - "Dockerfile.prover"
      - "scripts/build-eif.sh"
      - ".github/workflows/docker-proof.yml"
      - ".github/actions/docker-build-push-digest/**"
      - ".github/actions/docker-merge-manifest/**"

env:
  REPO_NAME: ${{ github.event.repository.name }}
  IMAGE_NAME: ${{ github.repository }}
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  AWS_REGION: us-east-1
  SCCACHE_BUCKET: crypto-dev-us-east-1-workflow-build-cache

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  resolve-sha:
    name: resolve build SHA
    runs-on: ubuntu-latest
    outputs:
      short: ${{ steps.sha.outputs.short }}
      full: ${{ steps.sha.outputs.full }}
    steps:
      - name: Check Out Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
      - name: Get short SHA
        id: sha
        run: |
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "full=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-sp1-guests:
    name: build canonical SP1 guests
    needs: [resolve-sha]
    environment:
      name: dev
      deployment: false
    runs-on: arc-public-8xlarge-amd64-runner
    steps:
      - name: Check Out Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve-sha.outputs.full }}
      - name: Prepare cache
        id: cache
        env:
          CACHE_SCOPE: ${{ github.ref_name }}
        run: |
          cache_scope="${CACHE_SCOPE//\//-}"
          cache_prefix="buildkit/${IMAGE_NAME}-sp1-guests/linux-amd64"
          {
            echo "from<<EOF"
            echo "type=s3,region=${AWS_REGION},bucket=${SCCACHE_BUCKET},prefix=${cache_prefix},name=${cache_scope}"
            echo "type=s3,region=${AWS_REGION},bucket=${SCCACHE_BUCKET},prefix=${cache_prefix},name=main"
            echo "EOF"
            echo "to=type=s3,region=${AWS_REGION},bucket=${SCCACHE_BUCKET},prefix=${cache_prefix},name=${cache_scope},mode=max"
          } >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Configure AWS credentials for BuildKit cache
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::348981876543:role/oidc/github-deploy
      - name: Build canonical guest ELFs
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.prover
          target: sp1-guests-context
          platforms: linux/amd64
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}
          outputs: type=local,dest=${{ runner.temp }}/sp1-guests-context
      - name: Upload canonical guest ELFs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sp1-guests-context
          path: ${{ runner.temp }}/sp1-guests-context/*
          if-no-files-found: error
          retention-days: 1

  # Service deployable images, built from the same Dockerfile.prover via
  # PROVER_PACKAGE/PROVER_BIN/FEATURES build-args. Each pushes to its own
  # `<repo>-<service>` image so tags do not collide with the builder image.
  build-service-images:
    name: build ${{ matrix.service.bin }} image
    needs: [resolve-sha, build-sp1-guests]
    environment:
      name: dev
      deployment: false
    strategy:
      fail-fast: false
      matrix:
        service:
          - { suffix: -sp1-worker, package: world-chain-proof-sp1-worker, bin: world-chain-proof-sp1-worker, prefix: digests-sp1-worker, target: sp1-worker }
          - { suffix: -proposer, package: world-chain-proposer, bin: world-chain-proposer, prefix: digests-proposer, target: final }
          - { suffix: -challenger, package: world-chain-challenger, bin: world-chain-challenger, prefix: digests-challenger, target: final }
          - { suffix: -defender, package: world-chain-defender, bin: world-chain-defender, prefix: digests-defender, target: final }
          - { suffix: -prover-service, package: world-chain-prover-service, bin: world-chain-prover-service, prefix: digests-prover-service, target: final }
        platform:
          - { runner: arc-public-8xlarge-amd64-runner, platform: linux/amd64 }
          - { runner: ubuntu-24.04-arm, platform: linux/arm64 }
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Check Out Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve-sha.outputs.full }}
      - name: Download canonical SP1 guest ELFs
        if: matrix.service.target == 'sp1-worker'
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          name: sp1-guests-context
          path: ${{ runner.temp }}/sp1-guests-context
      - name: Build and push digest
        uses: ./.github/actions/docker-build-push-digest
        with:
          platform: ${{ matrix.platform.platform }}
          registry: ${{ env.REGISTRY }}
          image_name: ${{ env.IMAGE_NAME }}${{ matrix.service.suffix }}
          aws_region: ${{ env.AWS_REGION }}
          sccache_bucket: ${{ env.SCCACHE_BUCKET }}
          dockerfile: Dockerfile.prover
          target: ${{ matrix.service.target }}
          build_contexts: ${{ matrix.service.target == 'sp1-worker' && format('sp1-guests-context={0}/sp1-guests-context', runner.temp) || '' }}
          build_args: |
            PROVER_PACKAGE=${{ matrix.service.package }}
            PROVER_BIN=${{ matrix.service.bin }}
          digest_artifact_prefix: ${{ matrix.service.prefix }}

  merge-service-images:
    name: merge ${{ matrix.service.bin }} image manifest
    needs: [resolve-sha, build-service-images]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - { suffix: -sp1-worker, prefix: digests-sp1-worker }
          - { suffix: -proposer, prefix: digests-proposer }
          - { suffix: -challenger, prefix: digests-challenger }
          - { suffix: -defender, prefix: digests-defender }
          - { suffix: -prover-service, prefix: digests-prover-service }
    steps:
      - name: Check Out Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve-sha.outputs.full }}
      - name: Merge multi-arch manifest
        uses: ./.github/actions/docker-merge-manifest
        with:
          registry: ${{ env.REGISTRY }}
          image_name: ${{ env.IMAGE_NAME }}${{ matrix.service.suffix }}
          digest_artifact_prefix: ${{ matrix.service.prefix }}
          tags: |
            type=raw,value=${{ inputs.image_tag || 'nightly' }}
            type=raw,value=sha-${{ needs.resolve-sha.outputs.short }}

  # nitro-worker is Linux x86_64 only (requires AF_VSOCK), so it cannot be
  # built in the multi-arch service matrix above.
  build-nitro-worker-image:
    name: build nitro-worker image
    needs: [resolve-sha]
    environment:
      name: dev
      deployment: false
    runs-on: arc-public-8xlarge-amd64-runner
    steps:
      - name: Check Out Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve-sha.outputs.full }}
      - name: Build and push digest
        uses: ./.github/actions/docker-build-push-digest
        with:
          platform: linux/amd64
          registry: ${{ env.REGISTRY }}
          image_name: ${{ env.IMAGE_NAME }}-nitro-worker
          aws_region: ${{ env.AWS_REGION }}
          sccache_bucket: ${{ env.SCCACHE_BUCKET }}
          dockerfile: Dockerfile.prover
          build_args: |
            PROVER_PACKAGE=world-chain-proof-nitro-worker
            PROVER_BIN=world-chain-proof-nitro-worker
          digest_artifact_prefix: digests-nitro-worker

  merge-nitro-worker-image:
    name: merge nitro-worker image manifest
    needs: [resolve-sha, build-nitro-worker-image]
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve-sha.outputs.full }}
      - name: Merge multi-arch manifest
        uses: ./.github/actions/docker-merge-manifest
        with:
          registry: ${{ env.REGISTRY }}
          image_name: ${{ env.IMAGE_NAME }}-nitro-worker
          digest_artifact_prefix: digests-nitro-worker
          digest_artifact_pattern: digests-nitro-worker-linux-*
          tags: |
            type=raw,value=${{ inputs.image_tag || 'nightly' }}
            type=raw,value=sha-${{ needs.resolve-sha.outputs.short }}

  # One Nix build produces both published artifacts: the enclave image itself and the EIF
  # measured from it. They were two jobs building two different rootfs images — the Dockerfile
  # one was published while the Nix one was measured — which is exactly the discrepancy that
  # makes a PCR impossible to trust. Same rootfs now, by construction.
  #
  # The EIF is packaged into a minimal OCI carrier image so Kubernetes pods can pull it via an
  # init container (AWS Nitro Enclaves K8s device plugin pattern).
  build-nitro-enclave-eif-image:
    name: build nitro-enclave image and EIF carrier
    if: ${{ !inputs.services_only }}
    needs: [resolve-sha]
    runs-on: arc-public-8xlarge-amd64-runner
    outputs:
      pcr0: ${{ steps.pcrs.outputs.pcr0 }}
      pcr1: ${{ steps.pcrs.outputs.pcr1 }}
      pcr2: ${{ steps.pcrs.outputs.pcr2 }}
    steps:
      - name: Check Out Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve-sha.outputs.full }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      # TODO: pin by commit SHA once the action is allowlisted, to match every other action
      # in this repo.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Publishes the exact rootfs the EIF below is measured from. Nitro Enclaves are x86_64
      # only, so there is no manifest to merge.
      - name: Build and push the enclave image
        env:
          TAG: ${{ inputs.image_tag || 'nightly' }}
          SHORT: ${{ needs.resolve-sha.outputs.short }}
        run: |
          image=$(nix build .#enclave-image --no-link --print-out-paths)
          docker load -i "$image"
          for tag in "$TAG" "sha-$SHORT"; do
            ref="$REGISTRY/$IMAGE_NAME-nitro-enclave:$tag"
            docker tag world-chain-nitro-enclave:nix "$ref"
            docker push "$ref"
          done
      # Reuses the image loaded above; nix build is a store hit, so nothing is recompiled.
      - name: Build EIF
        run: scripts/build-eif.sh target/eif
      - name: Extract PCRs
        id: pcrs
        run: |
          jq -r '"pcr0=\(.nitro.pcr0)", "pcr1=\(.nitro.pcr1)", "pcr2=\(.nitro.pcr2)"' \
            target/eif/measurements.json >> "$GITHUB_OUTPUT"
      - name: Upload measurements
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nitro-enclave-measurements
          path: target/eif/measurements.json

      # Surface, never commit: informational only — release-proof.yml is the enforcing
      # gate. Publishes the fresh `.nitro` half when the committed file has gone stale.
      - name: Compare measurements to committed
        run: |
          set -euo pipefail
          if diff <(jq -S .nitro proofs/measurements.json) <(jq -S .nitro target/eif/measurements.json) > /tmp/nitro-measurements.diff; then
            echo "PCRs match the committed proofs/measurements.json." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Committed \`.nitro\` measurements are stale"
              echo '```diff'
              cat /tmp/nitro-measurements.diff
              echo '```'
              echo "Fresh \`.nitro\` half — paste into \`proofs/measurements.json\`:"
              echo '```json'
              jq -S .nitro target/eif/measurements.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and push EIF carrier image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: proofs/measured/nitro-enclave/Dockerfile.eif
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-nitro-enclave-eif:${{ inputs.image_tag || 'nightly' }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-nitro-enclave-eif:sha-${{ needs.resolve-sha.outputs.short }}

  summary:
    name: Image tags summary
    if: ${{ always() && !inputs.services_only }}
    needs:
      - resolve-sha
      - merge-nitro-worker-image
      - build-nitro-enclave-eif-image
      - merge-service-images
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        env:
          TAG:                 ${{ inputs.image_tag || 'nightly' }}
          SHORT:               ${{ needs.resolve-sha.outputs.short }}
          NITRO_WORKER_RESULT: ${{ needs.merge-nitro-worker-image.result }}
          NITRO_ENCLAVE_RESULT: ${{ needs.build-nitro-enclave-eif-image.result }}
          EIF_RESULT:          ${{ needs.build-nitro-enclave-eif-image.result }}
          SERVICES_RESULT:     ${{ needs.merge-service-images.result }}
          PCR0:                ${{ needs.build-nitro-enclave-eif-image.outputs.pcr0 }}
          PCR1:                ${{ needs.build-nitro-enclave-eif-image.outputs.pcr1 }}
          PCR2:                ${{ needs.build-nitro-enclave-eif-image.outputs.pcr2 }}
        run: |
          REPO="ghcr.io/${{ github.repository }}"
          status() { [ "$1" = "success" ] && echo "✅" || echo "❌ ($1)"; }
          {
            echo "## 🐳 Image build results"
            echo ""
            echo "| Image | Tags | Status |"
            echo "|-------|------|--------|"
            echo "| \`$IMAGE_NAME-nitro-worker\` | \`$TAG\` \`sha-$SHORT\` | $(status $NITRO_WORKER_RESULT) |"
            echo "| \`$IMAGE_NAME-nitro-enclave\` | \`$TAG\` \`sha-$SHORT\` | $(status $NITRO_ENCLAVE_RESULT) |"
            echo "| \`$IMAGE_NAME-nitro-enclave-eif\` | \`$TAG\` \`sha-$SHORT\` | $(status $EIF_RESULT) |"
            echo "| \`$IMAGE_NAME-sp1-worker\` | \`$TAG\` \`sha-$SHORT\` | $(status $SERVICES_RESULT) |"
            echo "| \`$IMAGE_NAME-proposer\` | \`$TAG\` \`sha-$SHORT\` | $(status $SERVICES_RESULT) |"
            echo "| \`$IMAGE_NAME-challenger\` | \`$TAG\` \`sha-$SHORT\` | $(status $SERVICES_RESULT) |"
            echo "| \`$IMAGE_NAME-defender\` | \`$TAG\` \`sha-$SHORT\` | $(status $SERVICES_RESULT) |"
            echo "| \`$IMAGE_NAME-prover-service\` | \`$TAG\` \`sha-$SHORT\` | $(status $SERVICES_RESULT) |"

            if [ -n "${PCR0:-}" ]; then
              echo ""
              echo "## 🔒 Enclave PCR measurements"
              echo ""
              echo "| PCR | Value |"
              echo "|-----|-------|"
              echo "| PCR0 | \`$PCR0\` |"
              echo "| PCR1 | \`$PCR1\` |"
              echo "| PCR2 | \`$PCR2\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
