name: docker-proof

# Image-only path for the prover deployables: builds and pushes the prover docker
# images to ghcr on merge to main (tag `nightly`) or via manual dispatch with a
# chosen `image_tag` (e.g. `alpha-v0.1.0`). It does NOT cut a release — versioned
# releases (manifest.json, signed binaries, EIF, vkeys) are cut by release-proof.yml
# on `proof/v*` tag pushes once the services are ready.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to build.
        required: false
        default: main
      image_tag:
        description: Custom image tag to publish (e.g. "alpha-v0.1.0").
        required: false
        default: nightly
  push:
    branches: [main]
    paths:
      - "proofs/**"
      - "crates/chainspec/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/config.toml"
      - "Dockerfile.prover"
      - "scripts/build-eif.sh"
      - ".github/workflows/docker-proof.yml"
      - ".github/actions/docker-build-push-digest/**"
      - ".github/actions/docker-merge-manifest/**"

env:
  REPO_NAME: ${{ github.event.repository.name }}
  IMAGE_NAME: ${{ github.repository }}-proof
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  AWS_REGION: us-east-1
  SCCACHE_BUCKET: crypto-dev-us-east-1-workflow-build-cache

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  resolve-sha:
    name: resolve build SHA
    runs-on: ubuntu-latest
    outputs:
      short: ${{ steps.sha.outputs.short }}
    steps:
      - name: Check Out Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  # Service deployable images, built from the same Dockerfile.proof via
  # PROVER_PACKAGE/PROVER_BIN/FEATURES build-args. Each pushes to its own
  # `<repo>-<service>` image so tags do not collide with the `proof` image.
  build-service-images:
    name: build ${{ matrix.service.bin }} image
    needs: [resolve-sha]
    environment: dev
    strategy:
      fail-fast: false
      matrix:
        service:
          - { suffix: -sp1-worker, package: world-chain-proof-sp1-worker, bin: world-chain-proof-sp1-worker, prefix: digests-sp1-worker }
          - { suffix: -proposer, package: world-chain-proposer, bin: world-chain-proposer, prefix: digests-proposer }
          - { suffix: -challenger, package: world-chain-challenger, bin: world-chain-challenger, prefix: digests-challenger }
          - { suffix: -defender, package: world-chain-defender, bin: world-chain-defender, prefix: digests-defender }
          - { suffix: -prover-service, package: world-chain-prover-service, bin: world-chain-prover-service, prefix: digests-prover-service }
        platform:
          - { runner: arc-public-8xlarge-amd64-runner, platform: linux/amd64 }
          - { runner: ubuntu-24.04-arm, platform: linux/arm64 }
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Check Out Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
      - name: Build and push digest
        uses: ./.github/actions/docker-build-push-digest
        with:
          platform: ${{ matrix.platform.platform }}
          registry: ${{ env.REGISTRY }}
          image_name: ${{ env.IMAGE_NAME }}${{ matrix.service.suffix }}
          aws_region: ${{ env.AWS_REGION }}
          sccache_bucket: ${{ env.SCCACHE_BUCKET }}
          dockerfile: Dockerfile.prover
          build_args: |
            PROVER_PACKAGE=${{ matrix.service.package }}
            PROVER_BIN=${{ matrix.service.bin }}
          digest_artifact_prefix: ${{ matrix.service.prefix }}

  merge-service-images:
    name: merge ${{ matrix.service.bin }} image manifest
    needs: [resolve-sha, build-service-images]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - { suffix: -sp1-worker, prefix: digests-sp1-worker }
          - { suffix: -proposer, prefix: digests-proposer }
          - { suffix: -challenger, prefix: digests-challenger }
          - { suffix: -defender, prefix: digests-defender }
          - { suffix: -prover-service, prefix: digests-prover-service }
    steps:
      - name: Check Out Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
      - name: Merge multi-arch manifest
        uses: ./.github/actions/docker-merge-manifest
        with:
          registry: ${{ env.REGISTRY }}
          image_name: ${{ env.IMAGE_NAME }}${{ matrix.service.suffix }}
          digest_artifact_prefix: ${{ matrix.service.prefix }}
          tags: |
            type=raw,value=${{ inputs.image_tag || 'nightly' }}
            type=raw,value=sha-${{ needs.resolve-sha.outputs.short }}

  # nitro-worker is Linux x86_64 only (requires AF_VSOCK), so it cannot be
  # built in the multi-arch service matrix above.
  build-nitro-worker-image:
    name: build nitro-worker image
    needs: [resolve-sha]
    environment: dev
    runs-on: arc-public-8xlarge-amd64-runner
    steps:
      - name: Check Out Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
      - name: Build and push digest
        uses: ./.github/actions/docker-build-push-digest
        with:
          platform: linux/amd64
          registry: ${{ env.REGISTRY }}
          image_name: ${{ env.IMAGE_NAME }}-nitro-worker
          aws_region: ${{ env.AWS_REGION }}
          sccache_bucket: ${{ env.SCCACHE_BUCKET }}
          dockerfile: Dockerfile.prover
          build_args: |
            PROVER_PACKAGE=world-chain-proof-nitro-worker
            PROVER_BIN=world-chain-proof-nitro-worker
          digest_artifact_prefix: digests-nitro-worker

  merge-nitro-worker-image:
    name: merge nitro-worker image manifest
    needs: [resolve-sha, build-nitro-worker-image]
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
      - name: Merge multi-arch manifest
        uses: ./.github/actions/docker-merge-manifest
        with:
          registry: ${{ env.REGISTRY }}
          image_name: ${{ env.IMAGE_NAME }}-nitro-worker
          digest_artifact_prefix: digests-nitro-worker
          digest_artifact_pattern: digests-nitro-worker-linux-*
          tags: |
            type=raw,value=${{ inputs.image_tag || 'nightly' }}
            type=raw,value=sha-${{ needs.resolve-sha.outputs.short }}

  # nitro-enclave uses its own Dockerfile (proofs/backends/nitro/enclave/Dockerfile) and
  # is x86_64 only (Nitro Enclaves are x86_64).
  build-nitro-enclave-image:
    name: build nitro-enclave image
    needs: [resolve-sha]
    environment: dev
    runs-on: arc-public-8xlarge-amd64-runner
    steps:
      - name: Check Out Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
      - name: Build and push digest
        uses: ./.github/actions/docker-build-push-digest
        with:
          platform: linux/amd64
          registry: ${{ env.REGISTRY }}
          image_name: ${{ env.IMAGE_NAME }}-nitro-enclave
          aws_region: ${{ env.AWS_REGION }}
          sccache_bucket: ${{ env.SCCACHE_BUCKET }}
          dockerfile: proofs/backends/nitro/enclave/Dockerfile
          digest_artifact_prefix: digests-nitro-enclave

  merge-nitro-enclave-image:
    name: merge nitro-worker-enclave image manifest
    needs: [resolve-sha, build-nitro-enclave-image]
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
      - name: Merge multi-arch manifest
        uses: ./.github/actions/docker-merge-manifest
        with:
          registry: ${{ env.REGISTRY }}
          image_name: ${{ env.IMAGE_NAME }}-nitro-enclave
          digest_artifact_prefix: digests-nitro-enclave
          tags: |
            type=raw,value=${{ inputs.image_tag || 'nightly' }}
            type=raw,value=sha-${{ needs.resolve-sha.outputs.short }}

  # Build the Nitro Enclave Image Format (EIF) file from the enclave Docker image,
  # then package it into a minimal OCI carrier image pushed to GHCR so Kubernetes
  # pods can pull it via an init container (AWS Nitro Enclaves K8s device plugin pattern).
  build-nitro-enclave-eif-image:
    name: build nitro-worker-enclave EIF carrier image
    needs: [resolve-sha, build-nitro-enclave-image]
    runs-on: arc-public-8xlarge-amd64-runner
    steps:
      - name: Check Out Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - name: Build EIF
        run: scripts/build-eif.sh target/eif
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and push EIF carrier image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: proofs/backends/nitro/enclave/Dockerfile.eif
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-nitro-enclave-eif:${{ inputs.image_tag || 'nightly' }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-nitro-enclave-eif:sha-${{ needs.resolve-sha.outputs.short }}

  summary:
    name: Image tags summary
    if: always()
    needs:
      - resolve-sha
      - merge-nitro-worker-image
      - merge-nitro-enclave-image
      - build-nitro-enclave-eif-image
      - merge-service-images
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        env:
          TAG:                 ${{ inputs.image_tag || 'nightly' }}
          SHORT:               ${{ needs.resolve-sha.outputs.short }}
          NITRO_WORKER_RESULT: ${{ needs.merge-nitro-worker-image.result }}
          NITRO_ENCLAVE_RESULT:      ${{ needs.merge-nitro-enclave-image.result }}
          EIF_RESULT:          ${{ needs.build-nitro-enclave-eif-image.result }}
          SERVICES_RESULT:     ${{ needs.merge-service-images.result }}
        run: |
          REPO="ghcr.io/${{ github.repository }}"
          status() { [ "$1" = "success" ] && echo "✅" || echo "❌ ($1)"; }
          {
            echo "## 🐳 Image build results"
            echo ""
            echo "| Image | Tags | Status |"
            echo "|-------|------|--------|"
            echo "| \`$IMAGE_NAME-nitro-worker\` | \`$TAG\` \`sha-$SHORT\` | $(status $NITRO_WORKER_RESULT) |"
            echo "| \`$IMAGE_NAME-nitro-enclave\` | \`$TAG\` \`sha-$SHORT\` | $(status $NITRO_ENCLAVE_RESULT) |"
            echo "| \`$IMAGE_NAME-nitro-enclave-eif\` | \`$TAG\` \`sha-$SHORT\` | $(status $EIF_RESULT) |"
            echo "| \`$IMAGE_NAME-sp1-worker\` | \`$TAG\` \`sha-$SHORT\` | $(status $SERVICES_RESULT) |"
            echo "| \`$IMAGE_NAME-proposer\` | \`$TAG\` \`sha-$SHORT\` | $(status $SERVICES_RESULT) |"
            echo "| \`$IMAGE_NAME-challenger\` | \`$TAG\` \`sha-$SHORT\` | $(status $SERVICES_RESULT) |"
            echo "| \`$IMAGE_NAME-defender\` | \`$TAG\` \`sha-$SHORT\` | $(status $SERVICES_RESULT) |"
            echo "| \`$IMAGE_NAME-prover-service\` | \`$TAG\` \`sha-$SHORT\` | $(status $SERVICES_RESULT) |"
          } >> "$GITHUB_STEP_SUMMARY"
