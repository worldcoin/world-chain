name: Rust CI

on:
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".config/nextest.toml"
      - "clippy.toml"
      - "rustfmt.toml"
      - "Justfile"
      - "justfiles/rust.just"
      - "justfiles/contracts.just"
      - "justfiles/proof.just"
      - "pkg/contracts/src/**"
      - "crates/**/res/**"
      - ".github/workflows/rust-ci.yml"
  merge_group:
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".config/nextest.toml"
      - "clippy.toml"
      - "rustfmt.toml"
      - "Justfile"
      - "justfiles/rust.just"
      - "justfiles/contracts.just"
      - "justfiles/proof.just"
      - "pkg/contracts/src/**"
      - "crates/**/res/**"
      - ".github/workflows/rust-ci.yml"
  workflow_dispatch:
    inputs:
      qualification_commit:
        description: Optional full commit SHA for a native amd64 maxperf build and offline smoke test; uploads CI artifacts only.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  # Forks and Dependabot cannot obtain the OIDC token required by the S3 cache.
  RUSTC_WRAPPER: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'sccache' || '' }}
  WORLDCHAIN_PROVIDER: "${{ secrets.WORLDCHAIN_PROVIDER }}"
  AWS_REGION: us-east-1
  SCCACHE_BUCKET: crypto-dev-us-east-1-workflow-build-cache

jobs:
  native-amd64-qualification:
    if: github.event_name == 'workflow_dispatch' && inputs.qualification_commit != ''
    runs-on: arc-public-8xlarge-amd64-runner
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    env:
      QUALIFICATION_COMMIT: ${{ inputs.qualification_commit }}
      WORLDCHAIN_PROVIDER: ""
      RUSTC_WRAPPER: ""
      SCCACHE_BUCKET: ""
      BUILDX_METADATA_PROVENANCE: max
    steps:
      - name: Validate immutable source and native runner
        run: |
          [[ "$QUALIFICATION_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$QUALIFICATION_COMMIT" != 0000000000000000000000000000000000000000
          test "$(uname -m)" = x86_64
          test "$(docker info --format '{{.Architecture}}')" = x86_64
          printf 'QUALIFICATION_OUTPUT=%s/native-amd64-qualification\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.qualification_commit }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the production Dockerfile without publishing
        run: |
          test "$(git rev-parse HEAD)" = "$QUALIFICATION_COMMIT"
          mkdir "$QUALIFICATION_OUTPUT"
          {
            printf 'source_commit=%s\nworkflow_commit=%s\n' "$QUALIFICATION_COMMIT" "$GITHUB_WORKFLOW_SHA"
            git rev-parse 'HEAD^{tree}'
            uname -m
            docker info --format '{{.Architecture}}'
            docker buildx version
            sha256sum Dockerfile rust-toolchain.toml Cargo.lock
          } > "$QUALIFICATION_OUTPUT/source-and-runner.txt"
          docker buildx build --platform linux/amd64 --target runtime \
            --build-arg "VERGEN_GIT_SHA=$QUALIFICATION_COMMIT" \
            --build-arg PROFILE=maxperf --build-arg FEATURES=jemalloc \
            --metadata-file "$QUALIFICATION_OUTPUT/build-metadata.json" \
            --tag world-chain-native-qualification --load .
      - name: Check and export the actual image executable
        run: |
          image=world-chain-native-qualification
          docker image inspect "$image" --format '{{.Id}} {{.Os}}/{{.Architecture}}' > "$QUALIFICATION_OUTPUT/local-image.txt"
          docker run --rm --platform linux/amd64 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --user 10001:10001 \
            "$image" --version | tee "$QUALIFICATION_OUTPUT/version.txt"
          grep -Fx "Commit SHA: $QUALIFICATION_COMMIT" "$QUALIFICATION_OUTPUT/version.txt"
          docker run --rm --platform linux/amd64 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --user 10001:10001 \
            --entrypoint sh "$image" -ec 'ldd /usr/local/bin/world-chain' | tee "$QUALIFICATION_OUTPUT/libraries.txt"
          if grep -q 'not found' "$QUALIFICATION_OUTPUT/libraries.txt"; then exit 1; fi
          if ! docker run --rm --platform linux/amd64 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --user 10001:10001 \
            --memory 1g --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --tmpfs /data:rw,nosuid,nodev,uid=10001,gid=10001,size=256m \
            "$image" init --log.file.max-files 0 --chain worldchain-sepolia --datadir /data/reth \
            --db.max-size 512MB --db.growth-step 16MB > "$QUALIFICATION_OUTPUT/genesis-init.txt" 2>&1; then
            cat "$QUALIFICATION_OUTPUT/genesis-init.txt" >&2
            exit 1
          fi
          container=$(docker create --platform linux/amd64 "$image")
          trap 'docker rm "$container"' EXIT
          docker cp "$container:/usr/local/bin/world-chain" "$QUALIFICATION_OUTPUT/world-chain"
          (
            cd "$QUALIFICATION_OUTPUT"
            tar -czf world-chain-linux-amd64.tar.gz world-chain
            sha256sum world-chain world-chain-linux-amd64.tar.gz > SHA256SUMS
          )
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-amd64-${{ inputs.qualification_commit }}
          path: |
            ${{ env.QUALIFICATION_OUTPUT }}/*.txt
            ${{ env.QUALIFICATION_OUTPUT }}/*.json
            ${{ env.QUALIFICATION_OUTPUT }}/SHA256SUMS
            ${{ env.QUALIFICATION_OUTPUT }}/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  cargo-tests:
    if: github.event_name != 'workflow_dispatch' || inputs.qualification_commit == ''
    runs-on: arc-public-8xlarge-amd64-runner
    environment:
      name: dev
      deployment: false
    env:
      SCCACHE_BUCKET: crypto-dev-us-east-1-workflow-build-cache
      SCCACHE_REGION: us-east-1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: nightly-2026-10-10
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: just
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup mold
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      - name: Configure AWS credentials
        if: env.RUSTC_WRAPPER == 'sccache'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::348981876543:role/oidc/github-deploy
      - name: Setup sccache
        if: env.RUSTC_WRAPPER == 'sccache'
        uses: mozilla-actions/sccache-action@89e9040de88b577a072e3760aaf59f585da083af # v0.0.5
      - name: Cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        continue-on-error: false
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-test-
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: nextest
      - name: tests
        run: mold -run just test --profile ci --locked

  cargo-clippy:
    if: github.event_name != 'workflow_dispatch' || inputs.qualification_commit == ''
    runs-on: arc-public-8xlarge-amd64-runner
    environment:
      name: dev
      deployment: false
    timeout-minutes: 20
    name: clippy
    env:
      SCCACHE_BUCKET: crypto-dev-us-east-1-workflow-build-cache
      SCCACHE_REGION: us-east-1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: just
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: nightly-2026-10-10
          components: rustfmt, clippy
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure AWS credentials
        if: env.RUSTC_WRAPPER == 'sccache'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::348981876543:role/oidc/github-deploy
      - name: Setup sccache
        if: env.RUSTC_WRAPPER == 'sccache'
        uses: mozilla-actions/sccache-action@89e9040de88b577a072e3760aaf59f585da083af # v0.0.5
      - name: Cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        continue-on-error: false
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-test-
      - name: fmt
        run: cargo +nightly-2026-10-10 fmt --all -- --check
      - name: clippy
        run: cargo +nightly-2026-10-10 clippy --workspace --all-targets --all-features --locked -- -D warnings

  cargo-docs:
    if: github.event_name != 'workflow_dispatch' || inputs.qualification_commit == ''
    runs-on: arc-public-8xlarge-amd64-runner
    environment:
      name: dev
      deployment: false
    timeout-minutes: 20
    name: docs
    env:
      SCCACHE_BUCKET: crypto-dev-us-east-1-workflow-build-cache
      SCCACHE_REGION: us-east-1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: nightly-2026-10-10
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup mold
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      - name: Configure AWS credentials
        if: env.RUSTC_WRAPPER == 'sccache'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::348981876543:role/oidc/github-deploy
      - name: Setup sccache
        if: env.RUSTC_WRAPPER == 'sccache'
        uses: mozilla-actions/sccache-action@89e9040de88b577a072e3760aaf59f585da083af # v0.0.5
      - name: Cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        continue-on-error: false
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-test-
      - name: Generate CLI docs
        run: mold -run cargo xtask docs
      - name: Check docs are up to date
        run: git diff --exit-code specs/
