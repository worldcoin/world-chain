# This workflow is modified from Reth:
# https://github.com/paradigmxyz/reth/blob/main/.github/workflows/release.yml

name: release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to release
        required: true
        type: string
      version:
        description: Release version (for example, 2.4.1 or v2.4.1)
        required: true
        type: string
      prepared_release_id:
        description: Existing staged draft release ID (required from v2.9.0)
        type: string
      prepared_manifest_sha256:
        description: Independently reviewed release-manifest.json SHA-256
        type: string
      qualified_image_digests:
        description: RC-only JSON map of six immutable staged image digests for GHCR publication
        type: string

concurrency:
  group: release
  cancel-in-progress: false

env:
  REPO_NAME: ${{ github.event.repository.name }}
  IMAGE_NAME: ${{ github.repository }}
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  AWS_REGION: us-east-1
  SCCACHE_BUCKET: crypto-dev-us-east-1-workflow-build-cache

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  validate-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Validate release mode
        env:
          INPUT_VERSION: ${{ inputs.version }}
          PREPARED_RELEASE_ID: ${{ inputs.prepared_release_id }}
          PREPARED_MANIFEST_SHA256: ${{ inputs.prepared_manifest_sha256 }}
          QUALIFIED_IMAGE_DIGESTS: ${{ inputs.qualified_image_digests }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          python3 - <<'PY'
          import os, re
          version = os.environ['INPUT_VERSION'].removeprefix('v')
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?', version):
              raise SystemExit('Invalid release version')
          identifier, digest = os.environ['PREPARED_RELEASE_ID'], os.environ['PREPARED_MANIFEST_SHA256']
          images = os.environ['QUALIFIED_IMAGE_DIGESTS']
          if images:
              if identifier or digest or os.environ['GITHUB_REF'] != 'refs/heads/main':
                  raise SystemExit('RC image publication must run alone from main')
              if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*', version):
                  raise SystemExit('Qualified image publication is RC-only')
              if not re.fullmatch(r'[0-9a-f]{40}', os.environ['INPUT_REF']):
                  raise SystemExit('Qualified image publication requires a full immutable source commit')
          elif identifier:
              if os.environ['GITHUB_REF'] != 'refs/heads/main':
                  raise SystemExit('Dispatch the prepared-assets workflow from main')
              if not re.fullmatch(r'[1-9][0-9]{0,19}', identifier) or not re.fullmatch(r'[0-9a-f]{64}', digest):
                  raise SystemExit('Prepared mode requires a numeric draft ID and approved manifest SHA-256')
              source = os.environ['INPUT_REF']
              if not re.fullmatch(r'[0-9a-f]{40}', source) or source == '0' * 40:
                  raise SystemExit('Prepared mode requires a full immutable source commit')
          elif digest or tuple(map(int, version.split('-')[0].split('.'))) >= (2, 9, 0):
              raise SystemExit('v2.9.0 and later require the qualified prepared-assets path')
          PY

  approve-release:
    if: inputs.prepared_release_id == '' && inputs.qualified_image_digests == ''
    needs: validate-mode
    name: approve release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - run: true

  prepared-release:
    name: sign prepared distribution draft
    if: inputs.prepared_release_id != '' && inputs.qualified_image_digests == ''
    needs: validate-mode
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PREPARED_RELEASE_ID: ${{ inputs.prepared_release_id }}
      PREPARED_MANIFEST_SHA256: ${{ inputs.prepared_manifest_sha256 }}
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_REF: ${{ inputs.ref }}
      DOCUMENTATION_COMMIT: ${{ github.workflow_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the reviewed source and changes
        run: |
          source_commit=$(git rev-parse --verify --end-of-options "${INPUT_REF}^{commit}")
          version="v${INPUT_VERSION#v}"
          manifest_version=$(git cat-file blob "${source_commit}:Cargo.toml" | sed -n 's/^version = "\([^"]*\)"/\1/p')
          if [[ "$version" != "v$manifest_version" ]]; then
            if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]] || \
               [[ "${version%-rc.*}" != "v$manifest_version" ]]; then
              echo "Release version $version does not match Cargo.toml version $manifest_version" >&2
              exit 1
            fi
          fi
          if git show-ref --verify --quiet "refs/tags/$version"; then
            test "$(git rev-parse "refs/tags/${version}^{commit}")" = "$source_commit"
          fi
          echo "SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          previous=$(git describe --tags --match 'v*' --abbrev=0 "${source_commit}^" 2>/dev/null || true)
          range="${previous:+$previous..}$source_commit"
          git log --no-show-signature --pretty=format:'- %s' "$range" > prepared-changes.md
      - name: Verify every asset and published OCI binding
        timeout-minutes: 40
        run: |
          python3 .github/scripts/distribution-prepared.py \
            --release-id "$PREPARED_RELEASE_ID" --manifest-sha256 "$PREPARED_MANIFEST_SHA256" \
            --version "$VERSION" --source-commit "$SOURCE_COMMIT" \
            --output prepared --changes prepared-changes.md --documentation-commit "$DOCUMENTATION_COMMIT"
      - name: Sign verified assets with the established release identity
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          test ! -e prepared/INCOMPLETE
          umask 077
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d)
          cleanup() {
            local cleanup_status=$?
            gpgconf --kill gpg-agent || cleanup_status=1
            rm -rf -- "$GNUPGHOME" || cleanup_status=1
            return "$cleanup_status"
          }
          trap cleanup EXIT
          printf '%s' "$GPG_SIGNING_KEY" | base64 --decode | gpg --batch --import
          fingerprint=C75FBC64E9D48E89FB60418B8949B352D0422E74
          gpg --batch --list-secret-keys --with-colons "$fingerprint" > "$GNUPGHOME/identity"
          grep -q "^fpr:::::::::$fingerprint:" "$GNUPGHOME/identity"
          while IFS= read -r asset; do
            printf '%s' "$GPG_PASSPHRASE" | gpg --batch --pinentry-mode loopback \
              --passphrase-fd 0 --local-user "$fingerprint" --armor --detach-sign "prepared/$asset"
            gpg --batch --verify "prepared/$asset.asc" "prepared/$asset"
          done < prepared/release-files.txt
      - name: Attach signatures and approved-format notes to the draft
        timeout-minutes: 15
        run: |
          python3 .github/scripts/distribution-prepared.py --check-draft \
            --release-id "$PREPARED_RELEASE_ID" --manifest-sha256 "$PREPARED_MANIFEST_SHA256" \
            --version "$VERSION" --source-commit "$SOURCE_COMMIT" --output prepared
          signatures=()
          while IFS= read -r asset; do signatures+=("prepared/$asset.asc"); done < prepared/release-files.txt
          timeout 10m gh release upload "$VERSION" "${signatures[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          python3 .github/scripts/distribution-prepared.py --verify-uploaded \
            --release-id "$PREPARED_RELEASE_ID" --manifest-sha256 "$PREPARED_MANIFEST_SHA256" \
            --version "$VERSION" --source-commit "$SOURCE_COMMIT" --output prepared
          timeout 2m gh release edit "$VERSION" --notes-file prepared/release-notes.md --repo "$GITHUB_REPOSITORY"
      - name: Remove local prepared assets
        if: always()
        run: rm -rf -- prepared prepared-changes.md

  approve-qualified-images:
    name: approve qualified RC image publication
    if: inputs.qualified_image_digests != ''
    needs: validate-mode
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      - run: true

  publish-qualified-images:
    name: copy qualified RC images to GHCR
    if: inputs.qualified_image_digests != ''
    needs: approve-qualified-images
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: dev
      deployment: false
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_REF: ${{ inputs.ref }}
      QUALIFIED_IMAGE_DIGESTS: ${{ inputs.qualified_image_digests }}
      STAGING_IMAGE: 348981876543.dkr.ecr.us-east-1.amazonaws.com/world-chain-builder
      DESTINATION_IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check source version
        run: |
          source_commit=$(git rev-parse --verify --end-of-options "${INPUT_REF}^{commit}")
          test "$source_commit" = "$INPUT_REF"
          git merge-base --is-ancestor "$source_commit" "${GITHUB_SHA}"
          version="v${INPUT_VERSION#v}"
          manifest_version=$(git cat-file blob "${source_commit}:Cargo.toml" | sed -n 's/^version = "\([^"]*\)"/\1/p')
          test "${version%-rc.*}" = "v$manifest_version"
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::348981876543:role/oidc/github-deploy
      - name: Log in to staging registry
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${STAGING_IMAGE%%/*}"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Publish and verify exact platform manifests
        run: |
          python3 .github/scripts/distribution-publish-images.py \
            --version "v${INPUT_VERSION#v}" --source-commit "$INPUT_REF" \
            --digests "$QUALIFIED_IMAGE_DIGESTS" --staging "$STAGING_IMAGE" \
            --destination "$DESTINATION_IMAGE" --output ghcr-image-bindings.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ghcr-image-bindings
          path: ghcr-image-bindings.json
          if-no-files-found: error
          retention-days: 7

  prepare-release:
    name: prepare release
    if: inputs.qualified_image_digests == ''
    needs: approve-release
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Prepare release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Invalid release version: $INPUT_VERSION" >&2
            exit 1
          fi

          manifest_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          if [[ "$version" != "$manifest_version" ]]; then
            echo "Release version $version does not match Cargo.toml version $manifest_version" >&2
            exit 1
          fi

          release_sha=$(git rev-parse HEAD)
          tag="v${version}"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "Release tag $tag already exists" >&2
            exit 1
          fi

          echo "VERSION=$tag" >> "$GITHUB_OUTPUT"
          echo "SHA=$release_sha" >> "$GITHUB_OUTPUT"
          echo "SHORT_SHA=${release_sha::7}" >> "$GITHUB_OUTPUT"
        id: release
    outputs:
      VERSION: ${{ steps.release.outputs.VERSION }}
      SHA: ${{ steps.release.outputs.SHA }}
      SHORT_SHA: ${{ steps.release.outputs.SHORT_SHA }}

  build-and-push:
    name: build and push docker
    environment:
      name: dev
      deployment: false
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: arc-public-8xlarge-amd64-runner
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check Out Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare-release.outputs.SHA }}
      - name: Build and push digest
        uses: ./.github/actions/docker-build-push-digest
        with:
          platform: ${{ matrix.platform }}
          registry: ${{ env.REGISTRY }}
          image_name: ${{ env.IMAGE_NAME }}
          aws_region: ${{ env.AWS_REGION }}
          sccache_bucket: ${{ env.SCCACHE_BUCKET }}
          git_sha: ${{ needs.prepare-release.outputs.SHA }}
          cache_scope: ${{ inputs.ref }}
          no_cache_filters: runtime-tools,runtime

  merge:
    runs-on: ubuntu-latest
    needs:
      - build-and-push
      - prepare-release
    steps:
      - name: Check Out Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare-release.outputs.SHA }}
      - name: Merge multi-arch manifest
        uses: ./.github/actions/docker-merge-manifest
        with:
          registry: ${{ env.REGISTRY }}
          image_name: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.prepare-release.outputs.VERSION }}
            type=raw,value=sha-${{ needs.prepare-release.outputs.SHORT_SHA }}

  build-binaries:
    name: build binaries
    needs: [prepare-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os: linux
            arch: x86_64
            binary: world-chain
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            os: linux
            arch: arm64
            binary: world-chain
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare-release.outputs.SHA }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Cargo Build Release
        run: cargo build --locked --release --bin ${{ matrix.binary }} --target ${{ matrix.target }}

      - name: Move binary
        run: |
          mkdir artifacts
          mv "target/${{ matrix.target }}/release/${{ matrix.binary }}" ./artifacts

      - name: Configure GPG and create artifacts
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          export GPG_TTY=$(tty)
          echo -n "$GPG_SIGNING_KEY" | base64 --decode | gpg --batch --import
          cd artifacts
          tar -czf ${{ env.REPO_NAME }}-${{ needs.prepare-release.outputs.VERSION }}-${{ matrix.target }}.tar.gz ${{ matrix.binary }}*
          echo "$GPG_PASSPHRASE" | gpg --passphrase-fd 0 --pinentry-mode loopback --batch -ab ${{ env.REPO_NAME }}-${{ needs.prepare-release.outputs.VERSION }}-${{ matrix.target }}.tar.gz
          mv *tar.gz* ..
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.REPO_NAME }}-${{ needs.prepare-release.outputs.VERSION }}-${{ matrix.target }}.tar.gz
          path: ${{ env.REPO_NAME }}-${{ needs.prepare-release.outputs.VERSION }}-${{ matrix.target }}.tar.gz

      - name: Upload signature
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.REPO_NAME }}-${{ needs.prepare-release.outputs.VERSION }}-${{ matrix.target }}.tar.gz.asc
          path: ${{ env.REPO_NAME }}-${{ needs.prepare-release.outputs.VERSION }}-${{ matrix.target }}.tar.gz.asc

  draft-release:
    name: draft release
    needs: [build-and-push, merge, prepare-release, build-binaries]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare-release.outputs.VERSION }}
      RELEASE_SHA: ${{ needs.prepare-release.outputs.SHA }}
      REPO_NAME: ${{ github.event.repository.name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare-release.outputs.SHA }}
          fetch-depth: 0
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ${{ env.REPO_NAME }}-${{ env.VERSION }}-*
      - name: Generate full changelog
        id: changelog
        run: |
          previous_version=$(git describe --tags --match 'v*' --abbrev=0 "${RELEASE_SHA}^" 2>/dev/null || true)
          if [[ -n "$previous_version" ]]; then
            range="$previous_version..$RELEASE_SHA"
          else
            range="$RELEASE_SHA"
          fi

          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          git log --pretty=format:"- %s" "$range" >> $GITHUB_OUTPUT
          echo >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create release draft
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body=$(cat <<- "ENDBODY"
          ## All Changes

          ${{ steps.changelog.outputs.CHANGELOG }}

          ## Binaries

          The binaries are signed with the PGP key: \`C75F BC64 E9D4 8E89 FB60 418B 8949 B352 D042 2E74\`

          | System | Architecture | Binary | PGP Signature |
          |:---:|:---:|:---|:---|
          | <img src="https://simpleicons.org/icons/linux.svg" style="width: 32px;"/> | x86_64 | [${{ env.REPO_NAME }}-${{ env.VERSION }}-x86_64-unknown-linux-gnu.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/${{ env.REPO_NAME }}-${{ env.VERSION }}-x86_64-unknown-linux-gnu.tar.gz) | [${{ env.REPO_NAME }}-${{ env.VERSION }}-x86_64-unknown-linux-gnu.tar.gz.asc](https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/${{ env.REPO_NAME }}-${{ env.VERSION }}-x86_64-unknown-linux-gnu.tar.gz.asc) |
          | <img src="https://simpleicons.org/icons/linux.svg" style="width: 32px;"/> | aarch64 | [${{ env.REPO_NAME }}-${{ env.VERSION }}-aarch64-unknown-linux-gnu.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/${{ env.REPO_NAME }}-${{ env.VERSION }}-aarch64-unknown-linux-gnu.tar.gz) | [${{ env.REPO_NAME }}-${{ env.VERSION }}-aarch64-unknown-linux-gnu.tar.gz.asc](https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/${{ env.REPO_NAME }}-${{ env.VERSION }}-aarch64-unknown-linux-gnu.tar.gz.asc) |
          | | | |
          | **System** | **Option** | **Resource** |
          | <img src="https://simpleicons.org/icons/docker.svg" style="width: 32px;"/> | Docker | [${{ env.IMAGE_NAME }}](https://github.com/worldcoin/world-chain/pkgs/container/world-chain) |
          ENDBODY
          )
          assets=()
          for asset in ./*world-chain-*.tar.gz*; do
              assets+=("$asset/$asset")
          done
          tag_name="${{ env.VERSION }}"
          echo "$body" | gh release create --draft --target "$RELEASE_SHA" -t "$tag_name" -F "-" "$tag_name" "${assets[@]}"
