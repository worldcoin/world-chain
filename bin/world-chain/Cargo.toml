[package]
name = "world-chain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# world-chain
world-chain-cli.workspace = true
world-chain-chainspec.workspace = true
world-chain-evm.workspace = true
world-chain-node.workspace = true
world-chain-rpc.workspace = true

# reth
reth-cli-util.workspace = true
reth-db.workspace = true
reth-node-builder.workspace = true
reth-tasks.workspace = true
reth-tracing.workspace = true

# op-reth
reth-optimism-consensus.workspace = true
reth-optimism-exex = { workspace = true, features = ["metrics"] }
reth-optimism-node.workspace = true
reth-optimism-payload-builder.workspace = true
reth-optimism-primitives.workspace = true
reth-optimism-rpc.workspace = true
reth-optimism-trie = { workspace = true, features = ["metrics"] }

reth-provider.workspace = true

# misc
dotenvy.workspace = true
clap.workspace = true
eyre.workspace = true
futures-util.workspace = true
tokio.workspace = true

# optional
tikv-jemallocator = { workspace = true, optional = true }

[features]
default = ["jemalloc"]

jemalloc = ["tikv-jemallocator"]
