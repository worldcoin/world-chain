[package]
name = "world-chain-prover-service"
version = "1.0.0-rc.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "world-chain-prover-service"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# workspace
world-chain-proof-metrics.workspace = true

# alloy
alloy-primitives = { workspace = true, features = ["serde"] }

# misc
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
clap.workspace = true
dotenvy.workspace = true
jsonrpsee.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing.workspace = true
telemetry-batteries.workspace = true
uuid.workspace = true
auto_impl.workspace = true

[dev-dependencies]
testcontainers.workspace = true
testcontainers-modules.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

# Proofs release train: cargo-release bumps every shared-version member in lockstep.
[package.metadata.release]
shared-version = "proofs"
