[package]
name = "world-chain-proof-tx-signer"
version = "1.0.0-rc.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# alloy
alloy-network.workspace = true
alloy-provider = { workspace = true, features = ["reqwest", "reqwest-rustls-tls"] }
alloy-signer-aws.workspace = true
alloy-signer-local.workspace = true
alloy-transport.workspace = true

# aws
aws-config.workspace = true
aws-sdk-kms.workspace = true

# misc
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
alloy-primitives.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# Proofs release train: cargo-release bumps every shared-version member in lockstep.
[package.metadata.release]
shared-version = "proofs"
