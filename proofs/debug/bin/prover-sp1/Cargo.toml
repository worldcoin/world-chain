[package]
name = "world-chain-prover-sp1"
version = "1.0.0-rc.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "world-chain-prover-sp1"
path = "src/main.rs"

[dependencies]
alloy-primitives.workspace = true
anyhow.workspace = true
clap.workspace = true
dotenvy.workspace = true
hex.workspace = true
serde_json.workspace = true
sha2.workspace = true
sp1-sdk = { version = "=6.3.1", features = ["network"] }
tokio.workspace = true
world-chain-prover.workspace = true
world-chain-proof-core.workspace = true
world-chain-proof-sp1-host = { workspace = true, features = ["sp1"] }
world-chain-proof-sp1-elfs.workspace = true
world-chain-proof-sp1-types.workspace = true

# Proofs release train: cargo-release bumps every shared-version member in lockstep.
[package.metadata.release]
shared-version = "proofs"
