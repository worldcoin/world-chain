[package]
name = "world-chain-prover-cli"
version = "1.0.0-rc.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "CLI tool that submits ad-hoc test proof requests to a running prover-service, computing pre/post-state output roots and L1 head automatically from live L1/L2 RPCs."

[[bin]]
name = "prover-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# workspace
world-chain-proof-protocol.workspace = true
world-chain-prover-service.workspace = true
world-chain-proof-kona-host.workspace = true

# alloy
alloy-primitives = { workspace = true, features = ["serde"] }
alloy-provider = { workspace = true, features = ["reqwest", "reqwest-rustls-tls"] }

# misc
anyhow.workspace = true
clap.workspace = true
dotenvy.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true

# Proofs release train: cargo-release bumps every shared-version member in lockstep.
[package.metadata.release]
shared-version = "proofs"
