[package]
name = "world-chain-proof-nitro-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "AWS Nitro TEE proving worker: leases jobs from the prover-service, proves them inside a Nitro Enclave, and submits the signed attestations back."

[lib]
path = "src/lib.rs"

[[bin]]
name = "nitro-worker"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
# Generic worker infrastructure
world-chain-proof-worker.workspace = true
world-chain-proof-metrics.workspace = true
world-chain-prover-service.workspace = true

# Nitro prover (host-side, requires Linux + enclave feature)
world-chain-proof-nitro-enclave = { workspace = true, features = ["enclave"] }

# Witness generation (shared with sp1-worker)
world-chain-proof-kona-host-utils.workspace = true

# Chain config
world-chain-chainspec.workspace = true

# Alloy types
alloy-primitives = { workspace = true, features = ["serde"] }
alloy-sol-types.workspace = true

# Async / runtime
tokio = { workspace = true, features = ["full", "signal"] }
backon.workspace = true

# Error handling / logging
anyhow.workspace = true
async-trait.workspace = true
tracing.workspace = true
telemetry-batteries.workspace = true

# Config
clap.workspace = true
dotenvy.workspace = true

# Misc
hex.workspace = true
