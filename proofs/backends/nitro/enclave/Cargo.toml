[package]
name = "world-chain-proof-nitro-enclave"
version = "1.0.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"
homepage = "https://world.org/world-chain"
repository = "https://github.com/worldcoin/world-chain/"
description = "AWS Nitro TEE attestation prover for World Chain OP Succinct Lite fault proofs."

[workspace]

[lib]
path = "src/lib.rs"

# Runs inside the enclave; needs the kona stack and the NSM device.
[[bin]]
name = "world-chain-proof-nitro-enclave"
path = "src/main.rs"
required-features = ["enclave"]

[features]
default = []
# Host-side prover (vsock) plus the enclave-side code path. Linux only.
enclave = [
    "dep:kona-proof",
    "dep:tokio-vsock",
    "dep:tracing-subscriber",
    "dep:world-chain-proof-kona-client",
]

[dependencies]
# Shared (host + enclave) ----------------------------------------------------
alloy-primitives = { version = "1.6.0", default-features = false, features = [
    "std",
    "map-foldhash",
    "serde",
] }
alloy-sol-types = "1.6.0"
anyhow = { version = "1.0.86", default-features = false }
aws-nitro-enclaves-nsm-api = { version = "0.5", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
ciborium = "0.2"
coset = "0.4"
hex = "0.4.3"
num-bigint = "0.4"
num-traits = "0.2"
rkyv = { version = "0.8", features = ["hashbrown-0_15", "std"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
sha2 = "0.10.9"
thiserror = "2"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1"
world-chain-proof-core = { path = "../../../measured/core", default-features = false }

# Host-side attestation verification deps (non-optional: used by parse_check_and_verify) --
# These are compiled on all platforms; the p384 / x509-parser crates are pure Rust and
# compile on macOS / Linux alike.
p384 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
x509-parser = { version = "0.18", features = ["verify"] }
rustls-pki-types = "1"
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = [
    "ring",
    "std",
] }
k256 = { version = "0.13", features = ["ecdsa"] }

# Cargo features are target-independent, so `--all-features` on macOS still enables `enclave`.
# This table is what keeps the AF_VSOCK / NSM crates off non-Linux hosts.
[target.'cfg(target_os = "linux")'.dependencies]
tokio-vsock = { version = "0.5", optional = true }
aws-nitro-enclaves-nsm-api = { version = "0.5", features = ["nix"] }
kona-proof = { git = "https://github.com/ethereum-optimism/optimism", tag = "op-reth/v2.4.2", optional = true }
world-chain-proof-kona-client = { path = "../../../measured/kona-client", default-features = false, optional = true }
# (k256 is in the top-level [dependencies] as a non-optional dep so it is
# available to both the enclave-side signing code and the host-side
# verification code in host.rs.)

# Feature-gated bin support -------------------------------------------------
tracing-subscriber = { version = "0.3.18", features = ["env-filter"], optional = true }

[dev-dependencies]
rand = "0.8"
rcgen = { version = "0.14.8", default-features = false, features = ["ring", "crypto"] }
serde_json = "1"
