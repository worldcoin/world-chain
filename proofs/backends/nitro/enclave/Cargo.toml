
# Standalone workspace: this crate is compiled into the EIF, so PCR0 and PCR2 are a function
# of exactly the dependency versions resolved here. Sharing the root workspace's
# `Cargo.lock` would mean any node-side dependency bump could rotate the enclave's
# measurements — and therefore its on-chain approval — for no reason.
#
# Adding a dependency here is a measurement change. Treat it as one.
[workspace]
resolver = "3"
members = ["."]

[workspace.package]
version = "2.4.2"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"
homepage = "https://world.org/world-chain"
repository = "https://github.com/worldcoin/world-chain/"

[workspace.lints.rust]
semicolon_in_expressions_from_macros = "allow"

[workspace.dependencies]
world-chain-proof-core = { path = "../../../core", default-features = false }
world-chain-proof-kona-client = { path = "../../../kona/client", default-features = false }
alloy-primitives = { version = "1.6.0", default-features = false, features = [
    "std",
    "map-foldhash",
] }
alloy-sol-types = "1.6.0"
anyhow = { version = "1.0.86", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
hex = "0.4.3"
rkyv = { version = "0.8", features = ["hashbrown-0_15", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
thiserror = "2"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
kona-proof = { git = "https://github.com/ethereum-optimism/optimism", tag = "op-reth/v2.4.2" }

[package]
name = "world-chain-proof-nitro-enclave"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "AWS Nitro TEE attestation prover for World Chain OP Succinct Lite fault proofs."

[lib]
path = "src/lib.rs"

# Runs inside the enclave; needs the kona stack and the NSM device.
[[bin]]
name = "world-chain-proof-nitro-enclave"
path = "src/main.rs"
required-features = ["enclave"]

[features]
default = []
# Host-side prover (vsock) plus the enclave-side code path. Linux only.
enclave = [
    "dep:kona-proof",
    "dep:tokio-vsock",
    "dep:tracing-subscriber",
    "dep:world-chain-proof-kona-client",
]

[dependencies]
alloy-primitives = { workspace = true, features = ["serde"] }
alloy-sol-types.workspace = true
anyhow.workspace = true
# `default-features = false` drops `nix`, and with it the Linux-only NSM driver.
aws-nitro-enclaves-nsm-api = { version = "0.5", default-features = false }
base64 = { workspace = true }
ciborium = "0.2"
coset = "0.4"
hex.workspace = true
num-bigint = "0.4"
num-traits = "0.2"
rkyv.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_bytes = "0.11"
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
world-chain-proof-core.workspace = true

p384 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
x509-parser = { version = "0.18", features = ["verify"] }
rustls-pki-types = "1"
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = [
    "ring",
    "std",
] }
k256 = { version = "0.13", features = ["ecdsa"] }

# Cargo features are target-independent, so `--all-features` on macOS still enables `enclave`.
# This table is what keeps the AF_VSOCK / NSM crates off non-Linux hosts.
[target.'cfg(target_os = "linux")'.dependencies]
tokio-vsock = { version = "0.5", optional = true }
# `nix` gates the NSM ioctl driver the enclave binary calls into.
aws-nitro-enclaves-nsm-api = { version = "0.5", features = ["nix"] }
kona-proof = { workspace = true, optional = true }
world-chain-proof-kona-client = { workspace = true, optional = true }

tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
rand = "0.8"
rcgen = { version = "0.14.8", default-features = false, features = ["ring", "crypto"] }
serde_json = { workspace = true }
