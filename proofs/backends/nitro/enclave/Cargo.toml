[package]
name = "world-chain-proof-nitro-enclave"
version = "1.0.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"
homepage = "https://world.org/world-chain"
repository = "https://github.com/worldcoin/world-chain/"
description = "AWS Nitro TEE attestation prover for World Chain OP Succinct Lite fault proofs."

[workspace]

[lib]
path = "src/lib.rs"

# Binary that runs inside the Nitro Enclave. Only built when the `enclave`
# feature is enabled because it depends on the full kona derivation stack and
# the NSM device interface that is only available inside the enclave runtime.
[[bin]]
name = "world-chain-proof-nitro-enclave"
path = "src/main.rs"
required-features = ["enclave"]

[features]
default = []
# Enables both the host-side prover (talks to a running Nitro enclave over vsock)
# and the enclave-side code path.
# Requires Linux (AF_VSOCK is not available on macOS or Windows).
enclave = [
    "dep:aws-nitro-enclaves-nsm-api",
    "dep:kona-proof",
    "dep:tokio-vsock",
    "dep:tracing-subscriber",
    "dep:world-chain-proof-kona-client",
    # On-chain registration (register::submit) — host-side L1 client.
    "dep:alloy-contract",
    "dep:alloy-provider",
    "dep:alloy-signer",
    "dep:alloy-signer-local",
    "dep:url",
    "dep:world-chain-proof-tx-signer",
]

[dependencies]
# Shared (host + enclave) ----------------------------------------------------
alloy-primitives = { version = "1.6.0", default-features = false, features = [
    "std",
    "map-foldhash",
    "serde",
] }
alloy-sol-types = "1.6.0"
anyhow = { version = "1.0.86", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
ciborium = "0.2"
hex = "0.4.3"
num-bigint = "0.4"
num-traits = "0.2"
rkyv = { version = "0.8", features = ["hashbrown-0_15", "std"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
sha2 = "0.10.9"
thiserror = "2"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1"
world-chain-proof-core = { path = "../../../core", default-features = false }

# Host-side attestation verification deps (non-optional: used by parse_check_and_verify) --
# These are compiled on all platforms; the p384 / x509-parser crates are pure Rust and
# compile on macOS / Linux alike.
p384 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
x509-parser = { version = "0.18", features = ["verify"] }
# secp256k1 signature verification used by the host-side prover to validate
# proof signatures returned by the enclave. Pure Rust — compiles on all
# platforms.
k256 = { version = "0.13", features = ["ecdsa"] }

# Linux-only host/enclave deps ----------------------------------------------
#
# Cargo features are target-independent, so `--all-features` on macOS still
# enables `enclave`. Keeping the platform-specific crates in this
# target table prevents Cargo from trying to compile AF_VSOCK/NSM deps on
# non-Linux hosts.
[target.'cfg(target_os = "linux")'.dependencies]
tokio-vsock = { version = "0.5", optional = true }
aws-nitro-enclaves-nsm-api = { version = "0.5", optional = true }
kona-proof = { git = "https://github.com/ethereum-optimism/optimism", tag = "op-reth/v2.4.2", optional = true }
world-chain-proof-kona-client = { path = "../../../kona/client", default-features = false, optional = true }
# (k256 is in the top-level [dependencies] as a non-optional dep so it is
# available to both the enclave-side signing code and the host-side
# verification code in host.rs.)

# On-chain registration (register module `submit` flow). Only used on Linux with the
# `enclave` feature; optional + kept in the target table so non-Linux / non-enclave builds
# don't pull them in.
alloy-contract = { version = "=2.1.1", default-features = false, optional = true }
alloy-provider = { version = "=2.1.1", default-features = false, features = [
    "reqwest",
    "reqwest-rustls-tls",
], optional = true }
alloy-signer = { version = "=2.1.1", default-features = false, optional = true }
alloy-signer-local = { version = "=2.1.1", default-features = false, features = [
    "mnemonic",
], optional = true }
url = { version = "2.5.7", optional = true }
world-chain-proof-tx-signer = { path = "../../../services/tx-signer", default-features = false, optional = true }

# Feature-gated bin support -------------------------------------------------
tracing-subscriber = { version = "0.3.18", features = ["env-filter"], optional = true }

[dev-dependencies]
rand = "0.8"
rcgen = { version = "0.14.8", default-features = false, features = ["ring", "crypto"] }
serde_json = "1"
