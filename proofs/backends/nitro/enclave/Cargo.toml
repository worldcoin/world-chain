[package]
name = "world-chain-proof-nitro-enclave"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "AWS Nitro TEE attestation prover for World Chain OP Succinct Lite fault proofs."

[lib]
path = "src/lib.rs"

# Runs inside the enclave; needs the kona stack and the NSM device.
[[bin]]
name = "world-chain-proof-nitro-enclave"
path = "src/main.rs"
required-features = ["enclave"]

[features]
default = []
# Host-side prover (vsock) plus the enclave-side code path. Linux only.
enclave = [
    "dep:kona-proof",
    "dep:tokio-vsock",
    "dep:tracing-subscriber",
    "dep:world-chain-proof-kona-client",
    "dep:alloy-contract",
    "dep:alloy-provider",
    "dep:alloy-signer",
    "dep:alloy-signer-local",
    "dep:url",
    "dep:world-chain-proof-tx-signer",
]

[dependencies]
alloy-primitives = { workspace = true, features = ["serde"] }
alloy-sol-types.workspace = true
anyhow.workspace = true
# `default-features = false` drops `nix`, and with it the Linux-only NSM driver.
aws-nitro-enclaves-nsm-api = { version = "0.5", default-features = false }
base64 = { workspace = true }
ciborium = "0.2"
coset = "0.4"
hex.workspace = true
num-bigint = "0.4"
num-traits = "0.2"
rkyv.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_bytes = "0.11"
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
world-chain-proof-core.workspace = true

p384 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
x509-parser = { version = "0.18", features = ["verify"] }
rustls-pki-types = "1"
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = [
    "ring",
    "std",
] }
k256 = { version = "0.13", features = ["ecdsa"] }

# Cargo features are target-independent, so `--all-features` on macOS still enables `enclave`.
# This table is what keeps the AF_VSOCK / NSM crates off non-Linux hosts.
[target.'cfg(target_os = "linux")'.dependencies]
tokio-vsock = { version = "0.5", optional = true }
# `nix` gates the NSM ioctl driver the enclave binary calls into.
aws-nitro-enclaves-nsm-api = { version = "0.5", features = ["nix"] }
kona-proof = { workspace = true, optional = true }
world-chain-proof-kona-client = { workspace = true, optional = true }

# On-chain registration (register::submit).
alloy-contract = { workspace = true, optional = true }
alloy-provider = { workspace = true, features = [
    "reqwest",
    "reqwest-rustls-tls",
], optional = true }
alloy-signer = { workspace = true, optional = true }
alloy-signer-local = { workspace = true, optional = true }
url = { workspace = true, optional = true }
world-chain-proof-tx-signer = { workspace = true, optional = true }

tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
rand = "0.8"
rcgen = { version = "0.14.8", default-features = false, features = ["ring", "crypto"] }
serde_json = { workspace = true }
