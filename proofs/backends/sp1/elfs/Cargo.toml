[package]
name = "world-chain-proof-sp1-elfs"
version = "1.0.0-rc.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
build = "build.rs"

[build-dependencies]
sp1-build = "=6.3.1"

[dependencies]
sp1-sdk = { version = "=6.3.1", features = ["network"] }

# Proofs release train: cargo-release bumps every shared-version member in lockstep.
[package.metadata.release]
shared-version = "proofs"
