[package]
name = "world-chain-proof-kona-host"
version = "1.0.0-rc.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
alloy-consensus.workspace = true
alloy-primitives = { workspace = true, features = ["serde"] }
anyhow.workspace = true
hex.workspace = true
kona-genesis.workspace = true
kona-host = { workspace = true, features = ["single"] }
kona-preimage.workspace = true
kona-proof.workspace = true
kona-sp1-host-utils = { git = "https://github.com/ethereum-optimism/optimism", rev = "96ffbb2a94f19886fe7e27c45f3310e64ccd18b3", default-features = false }
kona-protocol.workspace = true
reqwest = { workspace = true, features = ["blocking", "json", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
world-chain-proof-core.workspace = true
world-chain-proof-kona-client.workspace = true
world-chain-chainspec.workspace = true

# Proofs release train: cargo-release bumps every shared-version member in lockstep.
[package.metadata.release]
shared-version = "proofs"
