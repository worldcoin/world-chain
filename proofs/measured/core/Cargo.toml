# Standalone workspace, in place.
# 
# This crate is compiled into both the SP1 guest ELFs and the Nitro enclave binary, so its
# dependency versions are an input to the vkeys and the PCRs. It pins them here rather than
# inheriting the root workspace's `[workspace.dependencies]`, where a bump made for the node
# would silently rotate an on-chain trust anchor.
# 
# Adding a dependency here is a measurement change. Treat it as one.
[workspace]
resolver = "3"
members = ["."]

[workspace.package]
version = "1.0.0-rc.1"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"
homepage = "https://world.org/world-chain"
repository = "https://github.com/worldcoin/world-chain/"

[workspace.lints.rust]
semicolon_in_expressions_from_macros = "allow"

[workspace.dependencies]
alloy-consensus = { version = "=2.1.1", default-features = false }
alloy-eips = { version = "=2.1.1", default-features = false, features = [
    "serde",
] }
alloy-primitives = { version = "1.6.0", default-features = false, features = [
    "std",
    "map-foldhash",
] }
alloy-sol-types = "1.6.0"
anyhow = { version = "1.0.86", default-features = false }
async-trait = "0.1.88"
kona-derive = { git = "https://github.com/ethereum-optimism/optimism", rev = "96ffbb2a94f19886fe7e27c45f3310e64ccd18b3", default-features = false }
kona-genesis = { git = "https://github.com/ethereum-optimism/optimism", rev = "96ffbb2a94f19886fe7e27c45f3310e64ccd18b3", default-features = false }
kona-preimage = { git = "https://github.com/ethereum-optimism/optimism", rev = "96ffbb2a94f19886fe7e27c45f3310e64ccd18b3", features = [
    "rkyv",
    "serde",
] }
kona-proof = { git = "https://github.com/ethereum-optimism/optimism", rev = "96ffbb2a94f19886fe7e27c45f3310e64ccd18b3" }
kona-protocol = { git = "https://github.com/ethereum-optimism/optimism", rev = "96ffbb2a94f19886fe7e27c45f3310e64ccd18b3", default-features = false }
kzg-rs = { version = "0.2.8", features = ["rkyv", "serde"] }
rkyv = { version = "0.8", features = ["hashbrown-0_15", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
thiserror = "2"

[package]
name = "world-chain-proof-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Shared proof primitives for World Chain fault-proof backends (SP1 and Nitro TEE)."

[dependencies]
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-primitives = { workspace = true, features = ["serde"] }
alloy-sol-types.workspace = true
anyhow.workspace = true
async-trait.workspace = true
kona-derive.workspace = true
kona-genesis.workspace = true
kona-preimage.workspace = true
kona-proof.workspace = true
kona-protocol.workspace = true
kzg-rs.workspace = true
rkyv.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
