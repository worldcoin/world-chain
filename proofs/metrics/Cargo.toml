[package]
name = "world-chain-proof-metrics"
version = "1.0.0-rc.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Shared metrics for World Chain proof services."

[lints]
workspace = true

[dependencies]
alloy-json-rpc.workspace = true
alloy-primitives.workspace = true
alloy-provider.workspace = true
alloy-rpc-client = { workspace = true, features = ["reqwest"] }
alloy-transport.workspace = true
alloy-transport-http = { workspace = true, features = [
    "reqwest",
    "reqwest-rustls-tls",
] }
telemetry-batteries.workspace = true
tower.workspace = true
tracing.workspace = true
url.workspace = true

# Proofs release train: cargo-release bumps every shared-version member in lockstep.
[package.metadata.release]
shared-version = "proofs"
